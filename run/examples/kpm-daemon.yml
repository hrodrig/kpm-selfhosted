# Daemon: sample → SQLite each tick. Optional notify + MCP/server HTTP.
# Prefer loopback listen on bastions; use 0.0.0.0 only behind a Service / proxy
# with token_env set. Slack: set KPM_SLACK_WEBHOOK when sinks are enabled.
# MCP bearer: set KPM_MCP_TOKEN.

cluster:
  name: "example-cluster"
  environment: "dev"
  description: "Operator daemon profile for kpm-selfhosted"

kube:
  context: ""

client:
  id: ""

store:
  path: "/data/metrics.db"
  retention_days: 45

sample:
  interval_seconds: 300

# scope:
#   namespaces: ["app"]

recommend:
  window_days: 7
  percentile: 95
  min_samples: 24
  target_utilization: 0.70

# notifications:
#   enabled: true
#   sinks:
#     - type: slack
#       webhook_url_env: KPM_SLACK_WEBHOOK

mcp:
  enabled: true
  listen: "0.0.0.0:9740"
  token_env: KPM_MCP_TOKEN
