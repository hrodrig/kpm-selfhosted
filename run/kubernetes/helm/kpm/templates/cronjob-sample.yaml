{{- if eq .Values.sampler "cronjob" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kpm.fullname" . }}-sample
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kpm.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.sample.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "kpm.selectorLabels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "kpm.fullname" . }}
          {{- include "kpm.imagePullSecrets" . | nindent 10 }}
          {{- include "kpm.podSecurityContext" . | nindent 10 }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: Never
          containers:
            - name: kpm
              image: {{ include "kpm.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- include "kpm.containerSecurityContext" . | nindent 14 }}
              args: ["sample", "--config", "/config/kpm.yml"]
              {{- if .Values.secrets.existingSecret }}
              envFrom:
                - secretRef:
                    name: {{ .Values.secrets.existingSecret }}
                    optional: true
              {{- end }}
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: store
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.sample.resources | nindent 16 }}
          volumes:
            - name: config
              configMap:
                name: {{ include "kpm.fullname" . }}-config
            - name: store
              persistentVolumeClaim:
                claimName: {{ include "kpm.claimName" . }}
            - name: tmp
              emptyDir: {}
{{- end }}
