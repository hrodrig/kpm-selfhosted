{{- if and (eq .Values.sampler "daemon") .Values.recommend.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kpm.fullname" . }}-recommend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kpm.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.recommend.schedule | quote }}
  {{- if .Values.recommend.timeZone }}
  timeZone: {{ .Values.recommend.timeZone | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.recommend.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "kpm.selectorLabels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "kpm.fullname" . }}-recommend
          {{- include "kpm.imagePullSecrets" . | nindent 10 }}
          {{- include "kpm.podSecurityContext" . | nindent 10 }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: Never
          containers:
            - name: recommend
              image: {{ .Values.recommend.kubectlImage | quote }}
              {{- include "kpm.containerSecurityContext" . | nindent 14 }}
              env:
                - name: HOME
                  value: /tmp
              command: ["/bin/kubectl"]
              args:
                - exec
                - deploy/{{ include "kpm.fullname" . }}
                - -n
                - {{ .Release.Namespace }}
                - -c
                - kpm
                - --
                - kpm
                - recommend
                - --record
                - --config
                - /config/kpm-daemon.yml
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.recommend.resources | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
