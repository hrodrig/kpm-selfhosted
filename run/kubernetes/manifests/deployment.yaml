# Daemon shape: ConfigMap must use interval_seconds > 0 and server listen
# (see run/examples/kpm-daemon.yml). Set KPM_SERVER_TOKEN in Secret kpm-secrets.
# Set KPM_MCP_TOKEN only after uncommenting mcp.enabled. One replica: the
# SQLite PVC is ReadWriteOnce.
# Do not also apply cronjob.yaml (kpm-sample); that Job mounts the same claim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kpm
  namespace: kpm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kpm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kpm
    spec:
      serviceAccountName: kpm
      containers:
        - name: kpm
          image: ghcr.io/hrodrig/kpm:v1.0.0
          args: ["sample", "--config", "/config/kpm-daemon.yml"]
          ports:
            - name: http
              containerPort: 9740
          envFrom:
            - secretRef:
                name: kpm-secrets
                optional: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: store
              mountPath: /data
          livenessProbe:
            httpGet:
              # /livez. Image v1.0.0 still answers /healthz (kpm#141).
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: kpm-config
        - name: store
          persistentVolumeClaim:
            claimName: kpm-store
---
apiVersion: v1
kind: Service
metadata:
  name: kpm
  namespace: kpm
spec:
  selector:
    app.kubernetes.io/name: kpm
  ports:
    - name: http
      port: 9740
      targetPort: http
