# One-shot sampler. Mounts the RWO store. Do not apply together with
# deployment.yaml. For a daemon that stays up, use deployment.yaml plus
# recommend-cronjob.yaml (that Job does not mount the claim).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kpm-sample
  namespace: kpm
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: kpm
          restartPolicy: Never
          containers:
            - name: kpm
              image: ghcr.io/hrodrig/kpm:v1.0.0
              args: ["sample", "--config", "/config/kpm.yml"]
              envFrom:
                - secretRef:
                    name: kpm-secrets
                    optional: true
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: store
                  mountPath: /data
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: config
              configMap:
                name: kpm-config
            - name: store
              persistentVolumeClaim:
                claimName: kpm-store
