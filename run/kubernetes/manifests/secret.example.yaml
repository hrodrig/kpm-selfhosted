# EXAMPLE ONLY — copy to secret.yaml (gitignored locally) or create via kubectl.
# Do not commit real webhook URLs or tokens.
#
#   kubectl -n kpm create secret generic kpm-secrets \
#     --from-literal=KPM_SLACK_WEBHOOK='https://hooks.slack.com/services/...' \
#     --from-literal=KPM_SERVER_TOKEN="$(openssl rand -hex 32)"
# Optional, only when mcp.enabled is true:
#     --from-literal=KPM_MCP_TOKEN="$(openssl rand -hex 32)"
#
apiVersion: v1
kind: Secret
metadata:
  name: kpm-secrets
  namespace: kpm
type: Opaque
stringData:
  KPM_SLACK_WEBHOOK: "REPLACE_WITH_SLACK_INCOMING_WEBHOOK_URL"
  KPM_SERVER_TOKEN: "REPLACE_WITH_RANDOM_HEX_TOKEN"
  # KPM_MCP_TOKEN: "REPLACE_WITH_RANDOM_HEX_TOKEN"
